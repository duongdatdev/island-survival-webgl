<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Island Survival — kiểm tra model</title>
    <style>
        :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#202821;color:#efe8d7}
        body{margin:0;display:grid;grid-template-columns:300px 1fr;height:100vh}
        aside{padding:24px;overflow:auto;border-right:1px solid #495343;background:#252e25}
        h1{font-size:20px;line-height:1.3;margin:0 0 8px}p{font-size:14px;line-height:1.6;color:#c5c9b8}
        label{display:block;font-size:14px;margin:18px 0 8px}
        input,select,button{font:inherit;color:inherit;background:#354132;border:1px solid #647357;border-radius:4px;padding:10px;box-sizing:border-box}
        input,select{width:100%}select{height:55vh;padding:4px}option{padding:8px}
        button{min-height:44px;cursor:pointer;margin-top:12px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e5c772;outline-offset:3px}
        main{position:relative;min-width:0}canvas{width:100%;height:100%;display:block}
        #details{position:absolute;left:24px;bottom:24px;background:#202820dd;padding:16px;max-width:70%;pointer-events:none;font-size:14px;line-height:1.6;white-space:pre-line}
        #status{font-size:14px;color:#e5c772;min-height:42px}
        @media(max-width:700px){body{grid-template-columns:210px 1fr}aside{padding:12px}h1{font-size:17px}}
    </style>
</head>
<body>
    <aside>
        <h1>Model chiến dịch 2.0</h1>
        <p>Kiểm tra màu, tỷ lệ và hình học bằng renderer của game. Công cụ phát triển; không nằm trong bản phát hành.</p>
        <div id="status" role="status">Đang tải model…</div>
        <label for="filter">Tìm model</label><input id="filter" type="search" placeholder="workbench, hook, cave…">
        <label for="models">Chọn model</label><select id="models" size="12" aria-label="Danh sách model"></select>
        <button id="rotate" type="button" aria-pressed="true">Dừng xoay</button>
        <button id="scan" type="button">Kiểm tra toàn bộ</button>
        <button id="world" type="button">Xem đảo chiến dịch</button>
    </aside>
    <main><canvas id="preview" aria-label="Xem trước model 3D"></canvas><div id="details"></div></main>
    <script type="module" src="./asset-gallery.js"></script>
</body>
</html>
